{% load static %} {# static dosya araçlarını yükle #}
<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width = device-width, initial-scale=1.0">
    <title>{% block title %}Randevu Takip{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
     <nav>
         <a href="{% url 'randevular:liste' %}">Randevularım</a>
         <a href="{% url 'randevular:olustur' %}">Yeni Randevu</a>
     </nav>
     <main>
         {% if messages %}
            <ul class="mesajlar">
                {% for message in messages %}
                   <li class="mesaj {{message.tags}}">{{ message }}</li>
                {% endfor %}
            </ul>
         {% endif %}

         {% block content %}{% endblock %}
     </main>
</body>
</html>
